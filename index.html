<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Analyzer</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#16312b;--mute:#5d716b;--line:#d5e0dc;--fill:#12806a;--on:#fff;--neg:#c2410c;--gbg:#bfe6cf;--gtx:#0a4f22;--rbg:#f5c2bd;--rtx:#7f1414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#16241f;--ink:#e6f0ec;--mute:#93a9a2;--line:#2a3d37;--fill:#3fc4a5;--on:#0f1a17;--neg:#fb923c;--gbg:#1f5a45;--gtx:#a8f0d0;--rbg:#6b2b24;--rtx:#ffbcb0}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#16241f;--ink:#e6f0ec;--mute:#93a9a2;--line:#2a3d37;--fill:#3fc4a5;--on:#0f1a17;--neg:#fb923c;--gbg:#1f5a45;--gtx:#a8f0d0;--rbg:#6b2b24;--rtx:#ffbcb0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 16px}
h2{font-size:1.05rem;margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:130px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
button.main{background:var(--fill);border-color:var(--fill);color:var(--on);font-weight:600}
button.tab.on{background:var(--fill);border-color:var(--fill);color:var(--on)}
button.danger{color:var(--neg);border-color:var(--neg)}
button.danger.solid{background:var(--neg);color:var(--on);font-weight:600}
.tabwrap{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabwrap.on{background:var(--fill);border-color:var(--fill);color:var(--on)}
.tabwrap button{border:0;background:transparent;color:inherit;border-radius:0}
.tabwrap button.x{padding:8px 10px 8px 2px;color:var(--mute)}
.tabwrap.on button.x{color:var(--on)}
button.x{padding:2px 8px;color:var(--mute)}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button.sm{padding:4px 12px}
.sform{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sform input{width:130px}
.sform .err{margin:0;min-height:0}
.sh{font-size:.9rem;color:var(--mute);margin:14px 0 4px;font-weight:600}
.srec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1/1}
.tilebtn{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.tilebtn:hover{border-color:var(--fill)}
.tilebtn b{font-size:1.05rem;word-break:break-word;padding-right:20px}
.tilebtn .tt{font-weight:700;color:var(--fill)}
.tilebtn .mute{display:block;margin-bottom:2px}
.tx{position:absolute;top:6px;right:6px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.head h2{margin:0;font-size:1.25rem}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--fill);outline-offset:1px}
.tabs{margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;padding:2px 4px 2px 12px}
.big{font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:.9rem}
.err{color:var(--neg);font-size:.9rem;min-height:1.3em;margin:8px 0 0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.modes{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 8px}
.modes label{display:flex;gap:6px;align-items:center}
.dd{position:relative;margin-top:4px}
.form .dd{margin-top:0}
.dd>button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;background:var(--bg)}
.dd>button::after{content:"\25BE";color:var(--mute)}
.ddlist{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto;padding:4px}
.opt{padding:8px 10px;border-radius:6px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--bg)}
.opt.on{background:var(--gbg);color:var(--gtx);font-weight:600}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.split label{font-size:.85rem;color:var(--mute);display:block}
.split input{width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute);font-size:.85rem}
.gets td{background:var(--gbg)}
.owes td{background:var(--rbg)}
.owes td:first-child{font-weight:700}
.gets td:last-child{color:var(--gtx);font-weight:700}
.owes td:last-child{color:var(--rtx);font-weight:700}
.gets td:first-child{font-weight:700}
b.recv{background:color-mix(in srgb,var(--fill) 22%,transparent);color:var(--fill);padding:1px 8px;border-radius:6px}
.pos{color:var(--fill);font-weight:600}.neg{color:var(--neg);font-weight:600}
.exp.editing{background:var(--bg)}
.exp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
li.pay{padding:7px 0;border-bottom:1px solid var(--line)}
@media (max-width:620px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/3}}
</style>
</head>
<body>
<main>
<h1>Expense Analyzer</h1>

<div class="panel row" id="delConfirm" hidden><span>Delete <b id="delName"></b> and all its expenses?</span><button class="danger solid" id="delYes">Yes, delete</button><button id="delNo">Keep</button></div>
<div id="home">
<div class="panel row">
  <input id="newTrip" placeholder="New trip name, for example Goa weekend" aria-label="New trip name">
  <button class="main" id="addTrip">Add trip</button>
</div>
<p class="mute" id="empty">No trips yet. Add one above to get started.</p>
<div class="tiles" id="tiles"></div>
</div>

<div id="tripPanel" hidden>
  <div class="head"><button id="back">← All trips</button><h2 id="tripTitle"></h2><button class="x" id="tripDel" aria-label="Delete this trip">×</button></div>
  <div class="panel">
    <div class="row"><label class="mute" for="currency">Currency</label><select id="currency"></select></div>
  </div>
  <div class="panel">
    <h2>People on <span id="tripName"></span></h2>
    <div class="row"><input id="newPerson" placeholder="Person's name" aria-label="Person's name"><button class="main" id="addPerson">Add person</button></div>
    <div class="chips" id="people"></div>
    <p class="err" id="pErr"></p>
  </div>

  <div class="panel">
    <h2 id="formTitle">Add expense</h2>
    <div class="form">
      <input id="desc" placeholder="What was it for?" aria-label="Expense description">
      <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount (₹)" aria-label="Amount in rupees">
      <div class="dd">
        <button type="button" id="payBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Paid by">Paid by</button>
        <div class="ddlist" id="payList" role="listbox" aria-multiselectable="true" aria-label="Paid by" hidden></div>
      </div>
      <input id="date" type="date" aria-label="Expense date">
    </div>
    <div id="payAmtsWrap" hidden style="margin-top:12px"><span class="mute">Amount paid by each (leave blank to split equally)</span><div class="split" id="payAmts" style="margin-top:6px"></div></div>
    <div style="margin-top:12px">
      <span class="mute" id="ddLabel">Split among</span>
      <div class="dd">
        <button type="button" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ddLabel ddBtn">Everyone</button>
        <div class="ddlist" id="who" role="listbox" aria-multiselectable="true" aria-labelledby="ddLabel" hidden></div>
      </div>
    </div>
    <div class="modes">
      <label><input type="radio" name="mode" value="equal" checked> Split equally</label>
      <label><input type="radio" name="mode" value="amount"> By amount</label>
      <label><input type="radio" name="mode" value="share"> By share</label>
    </div>
    <div class="split" id="split" hidden></div>
    <div class="row"><button class="main" id="addExp">Add expense</button><button id="cancelEdit" hidden>Cancel</button></div>
    <p class="err" id="eErr"></p>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Summary</h2><span class="row" style="gap:8px"><button id="copyBtn">Copy for Excel</button><button class="main" id="exportBtn">Export to Excel</button></span></div>
    <p class="mute" id="xNote" style="margin:0 0 10px"></p>
    <div class="big" id="total">0.00</div>
    <div class="mute" style="margin-bottom:12px">Total Expense</div>
    <div style="overflow-x:auto"><table id="tbl"></table></div>
    <h2 style="margin-top:18px">Who pays whom</h2>
    <ul id="settle"></ul>
    <div id="settled"></div>
  </div>

  <div class="panel">
    <h2>Expenses</h2>
    <div id="exps"></div>
  </div>
</div>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { trips: [], cur: null }, editing = null, sel = {}, paySel = {}, delId = null, view = 'home', settleKey = null;
  try { var s = localStorage.getItem('tripbudget'); if (s) state = JSON.parse(s); } catch (e) {}
  function save(){ try { localStorage.setItem('tripbudget', JSON.stringify(state)); } catch (e) {} }
  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function cur(){ return state.trips.filter(function(t){ return t.id === state.cur; })[0]; }
  var CUR = [['INR','Indian Rupee'],['USD','US Dollar'],['EUR','Euro'],['GBP','British Pound'],['JPY','Japanese Yen'],['AED','UAE Dirham'],['SGD','Singapore Dollar'],['AUD','Australian Dollar'],['CAD','Canadian Dollar'],['CHF','Swiss Franc'],['THB','Thai Baht'],['MYR','Malaysian Ringgit'],['IDR','Indonesian Rupiah'],['LKR','Sri Lankan Rupee'],['NPR','Nepalese Rupee']];
  var fmts = {};
  function code(){ var t = cur(); return (t && t.currency) || 'INR'; }
  function nf(c){ return fmts[c] || (fmts[c] = new Intl.NumberFormat(c === 'INR' ? 'en-IN' : 'en-US', { style: 'currency', currency: c, minimumFractionDigits: 2, maximumFractionDigits: 2 })); }
  function sym(c){ var p = nf(c).formatToParts(0).filter(function(x){ return x.type === 'currency'; })[0]; return p ? p.value : c; }
  function mc(n, c){ var r = Math.round(n * 100) / 100; return (r < 0 ? '-' : '') + nf(c).format(Math.abs(r)); }
  function m(n){ return mc(n, code()); }
  function tile(x){
    var tot = x.expenses.reduce(function(a, e){ return a + e.amount; }, 0), n = x.people.length;
    return '<div class="tile"><button class="tilebtn" data-open="' + x.id + '"><b>' + esc(x.name) + '</b><span><span class="mute">' + n + (n === 1 ? ' person' : ' people') +
      '</span><span class="tt">' + mc(tot, x.currency || 'INR') + '</span></span></button><button class="x tx" data-del-trip="' + x.id + '" aria-label="Delete trip ' + esc(x.name) + '">×</button></div>';
  }
  function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fdate(s){ return s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
  function mode(){ return document.querySelector('input[name=mode]:checked').value; }
  function name(t, id){ var p = t.people.filter(function(x){ return x.id === id; })[0]; return p ? p.name : '?'; }

  function owed(t, e){
    var r = {}, ps = e.people ? t.people.filter(function(p){ return e.people.indexOf(p.id) > -1; }) : t.people;
    if (!ps.length) ps = t.people;
    t.people.forEach(function(p){ r[p.id] = 0; });
    if (e.mode === 'equal') { ps.forEach(function(p){ r[p.id] = e.amount / ps.length; }); return r; }
    var sum = 0; ps.forEach(function(p){ sum += e.split[p.id] || 0; });
    ps.forEach(function(p){ var v = e.split[p.id] || 0; r[p.id] = e.mode === 'amount' ? v : (sum ? e.amount * v / sum : 0); });
    return r;
  }
  function whoText(t, e){
    if (!e.people) return '';
    var ps = t.people.filter(function(p){ return e.people.indexOf(p.id) > -1; });
    return ps.length >= t.people.length ? '' : ' among ' + ps.map(function(p){ return esc(p.name); }).join(', ');
  }
  function selected(){ var t = cur(); return t ? t.people.filter(function(p){ return sel[p.id] !== false; }) : []; }
  function renderWho(){
    var t = cur(); if (!t) return;
    var ps = selected(), all = ps.length === t.people.length;
    $('ddBtn').textContent = !t.people.length ? 'Add people first' : all ? 'Everyone' : ps.map(function(p){ return p.name; }).join(', ');
    $('who').innerHTML = !t.people.length ? '' :
      '<div class="opt' + (all ? ' on' : '') + '" role="option" tabindex="0" aria-selected="' + all + '" data-all="1">' + (all ? '\u2713 ' : '') + 'Everyone</div>' +
      t.people.map(function(p){
        var on = sel[p.id] !== false;
        return '<div class="opt' + (on ? ' on' : '') + '" role="option" tabindex="0" aria-selected="' + on + '" data-p="' + p.id + '">' + (on ? '\u2713 ' : '') + esc(p.name) + '</div>';
      }).join('');
  }
  function setDD(open){ $('who').hidden = !open; $('ddBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }
  function pick(el){
    if (!el) return;
    var key = el.dataset.all ? null : el.dataset.p;
    if (!key) sel = {};
    else if (sel[key] === false) sel[key] = true;
    else if (selected().length > 1) sel[key] = false;
    renderWho(); renderSplit(false);
    var nx = key ? $('who').querySelector('[data-p="' + key + '"]') : $('who').querySelector('[data-all]');
    if (nx) nx.focus();
  }

  function paidMap(e){ if (e.payers) return e.payers; var o = {}; o[e.payer] = e.amount; return o; }
  function paidText(t, e){
    var pm = paidMap(e), ks = Object.keys(pm);
    return ks.length === 1 ? esc(name(t, ks[0])) : ks.map(function(k){ return esc(name(t, k)) + ' (' + m(pm[k]) + ')'; }).join(', ');
  }
  function payers(){
    var t = cur(); if (!t) return [];
    var ps = t.people.filter(function(p){ return paySel[p.id]; });
    return ps.length || !t.people.length ? ps : [t.people[0]];
  }
  function renderPay(){
    var t = cur(); if (!t) return;
    var ps = payers(), on = {}; ps.forEach(function(p){ on[p.id] = true; });
    $('payBtn').textContent = !t.people.length ? 'Add people first' : 'Paid by ' + ps.map(function(p){ return p.name; }).join(', ');
    $('payList').innerHTML = t.people.map(function(p){
      return '<div class="opt' + (on[p.id] ? ' on' : '') + '" role="option" tabindex="0" aria-selected="' + !!on[p.id] + '" data-p="' + p.id + '">' + (on[p.id] ? '\u2713 ' : '') + esc(p.name) + '</div>';
    }).join('');
  }
  function renderPayAmts(reset){
    var box = $('payAmts'), old = {}, ps = payers();
    box.querySelectorAll('input').forEach(function(i){ old[i.dataset.p] = i.value; });
    $('payAmtsWrap').hidden = ps.length < 2;
    box.innerHTML = '';
    if (ps.length < 2) return;
    ps.forEach(function(p){
      var d = document.createElement('div');
      d.innerHTML = '<label>' + esc(p.name) + ' (paid)</label><input type="number" inputmode="decimal" min="0" step="any" data-p="' + p.id + '" value="' + (!reset && old[p.id] !== undefined ? old[p.id] : '') + '">';
      box.appendChild(d);
    });
  }
  function setPD(open){ $('payList').hidden = !open; $('payBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }
  function pickPay(el){
    if (!el) return;
    var id = el.dataset.p, cs = payers().map(function(p){ return p.id; });
    if (cs.indexOf(id) > -1) { if (cs.length < 2) return; cs = cs.filter(function(x){ return x !== id; }); }
    else cs.push(id);
    paySel = {}; cs.forEach(function(x){ paySel[x] = true; });
    renderPay(); renderPayAmts(false);
    var nx = $('payList').querySelector('[data-p="' + id + '"]'); if (nx) nx.focus();
  }
  function setEditUI(){
    $('formTitle').textContent = editing ? 'Edit expense' : 'Add expense';
    $('addExp').textContent = editing ? 'Save changes' : 'Add expense';
    $('cancelEdit').hidden = !editing;
  }
  function resetForm(){
    editing = null; $('desc').value = ''; $('amt').value = ''; $('date').value = today();
    document.querySelector('input[name=mode][value=equal]').checked = true;
    $('xNote').textContent = ''; settleKey = null; sel = {}; paySel = {}; setDD(false); setPD(false); setEditUI(); renderWho(); renderSplit(true); renderPay(); renderPayAmts(true);
  }
  function startEdit(id){
    var t = cur(), e = t.expenses.filter(function(x){ return x.id === id; })[0];
    if (!e) return;
    editing = id; sel = {}; t.people.forEach(function(p){ sel[p.id] = !e.people || e.people.indexOf(p.id) > -1; }); render();
    $('desc').value = e.desc; $('amt').value = e.amount; var pm = paidMap(e); paySel = {};
    Object.keys(pm).forEach(function(k){ if (t.people.some(function(p){ return p.id === k; })) paySel[k] = true; });
    renderPay(); renderPayAmts(true);
    if (Object.keys(pm).length > 1) $('payAmts').querySelectorAll('input').forEach(function(i){ i.value = pm[i.dataset.p] !== undefined ? pm[i.dataset.p] : ''; });
     $('date').value = e.date || today();
    document.querySelector('input[name=mode][value=' + e.mode + ']').checked = true;
    renderSplit(true);
    if (e.mode !== 'equal') $('split').querySelectorAll('input').forEach(function(i){
      var v = e.split[i.dataset.p]; i.value = v === undefined ? (e.mode === 'share' ? '0' : '') : v;
    });
    setEditUI(); $('eErr').textContent = '';
    $('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('desc').focus();
  }

  function renderSplit(reset){
    var t = cur(), box = $('split'), old = {};
    box.querySelectorAll('input').forEach(function(i){ old[i.dataset.p] = i.value; });
    var md = mode();
    var ps = selected(); box.hidden = md === 'equal' || !ps.length;
    box.innerHTML = '';
    if (!t) return;
    ps.forEach(function(p){
      var v = (!reset && old[p.id] !== undefined) ? old[p.id] : (md === 'share' ? '1' : '');
      var d = document.createElement('div');
      d.innerHTML = '<label>' + esc(p.name) + (md === 'share' ? ' (shares)' : ' (amount)') + '</label>' +
        '<input type="number" inputmode="decimal" min="0" step="any" data-p="' + p.id + '" value="' + v + '">';
      box.appendChild(d);
    });
  }

  function adjust(t){
    var a = {}; t.people.forEach(function(p){ a[p.id] = 0; });
    (t.settlements || []).forEach(function(x){ if (a[x.from] !== undefined) a[x.from] += x.amount; if (a[x.to] !== undefined) a[x.to] -= x.amount; });
    return a;
  }
  function plan(t, nets, orig){
    function greedy(ns){
      var cr = [], db = [], out = [];
      t.people.forEach(function(p){ var n = ns[p.id] || 0; if (n > 0) cr.push({ id: p.id, v: n }); else if (n < 0) db.push({ id: p.id, v: -n }); });
      cr.sort(function(a, b){ return b.v - a.v; }); db.sort(function(a, b){ return b.v - a.v; });
      var i = 0, j = 0;
      while (i < db.length && j < cr.length) {
        var x = Math.min(db[i].v, cr[j].v);
        out.push({ from: db[i].id, to: cr[j].id, v: Math.round(x * 100) / 100 });
        db[i].v -= x; cr[j].v -= x;
        if (db[i].v < 0.005) i++; if (cr[j].v < 0.005) j++;
      }
      return out;
    }
    var sl = t.settlements || [];
    if (!sl.length) return greedy(nets);
    // keep the original pairings and reduce each by what was paid
    var base = greedy(orig), ok = true;
    sl.forEach(function(x){
      var rem = x.amount;
      base.forEach(function(b){ if (b.from === x.from && b.to === x.to && rem > 0) { var d = Math.min(b.v, rem); b.v = Math.round((b.v - d) * 100) / 100; rem -= d; } });
      if (rem > 0.005) ok = false;
    });
    base = base.filter(function(b){ return b.v > 0.004; });

    var b = ev.target.closest('button'); if (!b) return;
    var t = cur();
    if (b.dataset.open) { state.cur = b.dataset.open; view = 'trip'; $('delConfirm').hidden = true; resetForm(); render(); window.scrollTo(0, 0); }
    else if (b.dataset.delTrip) {
      var dt = state.trips.filter(function(x){ return x.id === b.dataset.delTrip; })[0];
      if (dt) { delId = dt.id; $('delName').textContent = dt.name; $('delConfirm').hidden = false; $('delYes').focus(); $('delConfirm').scrollIntoView({ block: 'nearest' }); }
    }
    else if (b.dataset.settle) { settleKey = b.dataset.settle; render(); var si = $('settleAmt'); if (si) { si.focus(); si.select(); } }
    else if (b.dataset.settleOk) {
      var inp = $('settleAmt'), v = Math.round(parseFloat(inp.value) * 100) / 100, mx = parseFloat(inp.dataset.max), pr = b.dataset.settleOk.split('|');
      if (!(v > 0)) { $('settleErr').textContent = 'Enter an amount above 0.'; return; }
      if (v > mx + 0.001) { $('settleErr').textContent = 'That is more than the ' + m(mx) + ' owed.'; return; }
      (t.settlements = t.settlements || []).push({ id: uid(), from: pr[0], to: pr[1], amount: v, date: today() });
      settleKey = null; render();
    }
    else if (b.dataset.settleCancel) { settleKey = null; render(); }
    else if (b.dataset.delSettle) { t.settlements = (t.settlements || []).filter(function(x){ return x.id !== b.dataset.delSettle; }); render(); }
    else if (b.dataset.editExp) startEdit(b.dataset.editExp);
    else if (b.dataset.delExp) { if (editing === b.dataset.delExp) resetForm(); t.expenses = t.expenses.filter(function(e){ return e.id !== b.dataset.delExp; }); if (!t.expenses.length) t.settlements = []; render(); }
    else if (b.dataset.delPerson) {
      var id = b.dataset.delPerson;
      if (t.expenses.length) { $('pErr').textContent = 'Delete this trip\'s expenses before removing a person.'; return; }
      t.people = t.people.filter(function(p){ return p.id !== id; }); $('pErr').textContent = ''; render();
    }
  });
  $('currency').innerHTML = CUR.map(function(c){ return '<option value="' + c[0] + '">' + c[0] + ' (' + esc(sym(c[0])) + ') \u2013 ' + c[1] + '</option>'; }).join('');
  $('date').value = today();
  render();
})();
</script>
</body>
</html>
